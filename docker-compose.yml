services:
  db:
    image: postgres:16-alpine
    container_name: archerik-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: archerik
      POSTGRES_PASSWORD: archerik
      POSTGRES_DB: archerik
    ports:
      - '5432:5432'
    volumes:
      - archerik-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U archerik -d archerik']
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional web UI for the DB at http://localhost:8080 (profile: tools)
  adminer:
    image: adminer:4
    container_name: archerik-adminer
    restart: unless-stopped
    profiles: ['tools']
    ports:
      - '8080:8080'
    depends_on:
      - db

volumes:
  archerik-pgdata:
